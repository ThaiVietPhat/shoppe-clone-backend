version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopee-postgres
    environment:
      POSTGRES_DB: shopee_db
      POSTGRES_USER: shoppe
      POSTGRES_PASSWORD: shoppe
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppe -d shopee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-init:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["psql", "-h", "postgres", "-U", "shoppe", "-d", "shopee_db", "-c", "CREATE EXTENSION IF NOT EXISTS vector;"]
    environment:
      PGPASSWORD: shoppe
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: shopee-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: shopee-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: shopee-backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      ELASTICSEARCH_URI: http://elasticsearch:9200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
